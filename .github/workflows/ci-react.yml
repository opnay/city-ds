name: CI · React

on:
  push:
    paths:
      - '.github/workflows/ci-react.yml'
      - '.nvmrc'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'packages/react/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'turbo.json'
  pull_request:
    paths:
      - '.github/workflows/ci-react.yml'
      - '.nvmrc'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'packages/react/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-react-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: React package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and type checks
        run: pnpm turbo run lint typecheck --filter=@city-ds/react --concurrency=2

      - name: Run unit and component tests
        run: pnpm turbo run test --filter=@city-ds/react

      - name: Build package
        run: pnpm turbo run build --filter=@city-ds/react

      - name: Validate package exports
        run: pnpm --filter @city-ds/react pack:check
