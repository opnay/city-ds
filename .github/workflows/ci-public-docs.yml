name: CI · Public docs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci-public-docs.yml'
      - '.nvmrc'
      - 'apps/public-docs/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'packages/react/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'turbo.json'
  pull_request:
    paths:
      - '.github/workflows/ci-public-docs.yml'
      - '.nvmrc'
      - 'apps/public-docs/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'packages/react/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-public-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Public docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and type checks
        run: pnpm turbo run lint typecheck --filter=@city-ds/public-docs --concurrency=2

      - name: Run tests
        run: pnpm turbo run test --filter=@city-ds/public-docs

      - name: Build public docs
        run: pnpm turbo run build --filter=@city-ds/public-docs
