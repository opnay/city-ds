name: CI · Storybook

on:
  push:
    paths:
      - '.github/workflows/ci-storybook.yml'
      - '.nvmrc'
      - 'apps/storybook/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'packages/react/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'turbo.json'
  pull_request:
    paths:
      - '.github/workflows/ci-storybook.yml'
      - '.nvmrc'
      - 'apps/storybook/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'packages/react/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and type checks
        run: pnpm turbo run lint typecheck --filter=@city-ds/storybook --concurrency=2

      - name: Install test browser
        run: pnpm --filter @city-ds/storybook exec playwright install chromium

      - name: Run browser tests
        run: pnpm turbo run test --filter=@city-ds/storybook

      - name: Build Storybook
        run: pnpm turbo run build --filter=@city-ds/storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@v7
        with:
          name: city-ds-storybook
          path: apps/storybook/storybook-static
          if-no-files-found: error
          retention-days: 14
