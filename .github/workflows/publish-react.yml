name: Publish React package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-react-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and type checks
        run: pnpm turbo run lint typecheck --concurrency=2

  test:
    name: Test · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: React package
            package: '@opnay/city-ds-react'
            browser: false
          - name: Storybook
            package: '@city-ds/storybook'
            browser: true
          - name: Vite consumer
            package: '@city-ds/vite-smoke'
            browser: false
          - name: Next.js consumer
            package: '@city-ds/next-smoke'
            browser: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Storybook test browser
        if: matrix.browser
        run: pnpm --filter @city-ds/storybook exec playwright install chromium

      - name: Run tests
        run: pnpm turbo run test --filter='${{ matrix.package }}'

  build:
    name: Build and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build repository
        run: pnpm turbo run build

      - name: Validate package exports
        run: pnpm --filter @opnay/city-ds-react pack:check

      - name: Verify release tag
        run: >-
          node -e "const { version } = require('./packages/react/package.json');
          if (process.env.GITHUB_REF_NAME !== 'v' + version)
          throw new Error('Release tag must be v' + version);"

  publish:
    name: Publish package
    needs: [format, analyze, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@opnay'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish React package
        run: pnpm --filter @opnay/city-ds-react publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
